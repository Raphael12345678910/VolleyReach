  <rect x="96" y="928" width="888" height="2" fill="#dce2dd"/>
  <text x="96" y="976" fill="#12372e" font-family="Arial, sans-serif" font-size="24" font-weight="700">Save this checklist. Build the full profile in VolleyReach.</text>
