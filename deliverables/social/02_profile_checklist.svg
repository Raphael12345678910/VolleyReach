<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <rect width="1080" height="1080" fill="#12372e"/>
  <rect x="54" y="54" width="972" height="972" rx="8" fill="#fff"/>
  <text x="96" y="130" fill="#e66449" font-family="Arial, sans-serif" font-size="22" font-weight="700">RECRUITING PROFILE CHECKLIST</text>
  <text x="96" y="212" fill="#17201d" font-family="Arial, sans-serif" font-size="56" font-weight="700">Before you email a coach,</text>
  <text x="96" y="278" fill="#17201d" font-family="Arial, sans-serif" font-size="56" font-weight="700">make these easy to find.</text>
  <g font-family="Arial, sans-serif" font-size="31" fill="#17201d">
    <g transform="translate(96 350)"><rect width="42" height="42" rx="5" fill="#e1eee8" stroke="#205848" stroke-width="2"/><path d="m11 21 7 7 14-16" fill="none" stroke="#205848" stroke-width="4" stroke-linecap="round"/><text x="66" y="32">Graduation year and position</text></g>
    <g transform="translate(96 430)"><rect width="42" height="42" rx="5" fill="#e1eee8" stroke="#205848" stroke-width="2"/><path d="m11 21 7 7 14-16" fill="none" stroke="#205848" stroke-width="4" stroke-linecap="round"/><text x="66" y="32">Height, vertical, and approach touch</text></g>
    <g transform="translate(96 510)"><rect width="42" height="42" rx="5" fill="#e1eee8" stroke="#205848" stroke-width="2"/><path d="m11 21 7 7 14-16" fill="none" stroke="#205848" stroke-width="4" stroke-linecap="round"/><text x="66" y="32">GPA and academic interests</text></g>
    <g transform="translate(96 590)"><rect width="42" height="42" rx="5" fill="#e1eee8" stroke="#205848" stroke-width="2"/><path d="m11 21 7 7 14-16" fill="none" stroke="#205848" stroke-width="4" stroke-linecap="round"/><text x="66" y="32">Club, school, jersey, and role</text></g>
    <g transform="translate(96 670)"><rect width="42" height="42" rx="5" fill="#e1eee8" stroke="#205848" stroke-width="2"/><path d="m11 21 7 7 14-16" fill="none" stroke="#205848" stroke-width="4" stroke-linecap="round"/><text x="66" y="32">Highlight video and athlete profile</text></g>
    <g transform="translate(96 750)"><rect width="42" height="42" rx="5" fill="#e1eee8" stroke="#205848" stroke-width="2"/><path d="m11 21 7 7 14-16" fill="none" stroke="#205848" stroke-width="4" stroke-linecap="round"/><text x="66" y="32">Current coach contact information</text></g>
    <g transform="translate(96 830)"><rect width="42" height="42" rx="5" fill="#e1eee8" stroke="#205848" stroke-width="2"/><path d="m11 21 7 7 14-16" fill="none" stroke="#205848" stroke-width="4" stroke-linecap="round"/><text x="66" y="32">Upcoming club schedule, when available</text></g>
