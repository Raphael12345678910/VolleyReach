name: Publish website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
      VITE_AUTH_GOOGLE: ${{ vars.VITE_AUTH_GOOGLE }}
      VITE_AUTH_APPLE: ${{ vars.VITE_AUTH_APPLE }}
      PLAYWRIGHT_CHROMIUM_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build isolated test release
        run: npm run build
        env:
          VITE_SUPABASE_URL: ""
          VITE_SUPABASE_PUBLISHABLE_KEY: ""
          VITE_GA_MEASUREMENT_ID: ""
          VITE_AUTH_GOOGLE: "false"
          VITE_AUTH_APPLE: "false"
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Build configured public release
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
